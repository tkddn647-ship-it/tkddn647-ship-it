  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#121a33"/>
      <stop offset="1" stop-color="#1b1230"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="plot"><rect x="700" y="46" width="450" height="210" rx="10"/></clipPath>
    <style>
      .t1 { font: 700 46px 'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif; fill: #f8fafc; }
      .t2 { font: 500 20px 'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif; fill: #cbd5e1; }
      .t3 { font: 600 14px 'JetBrains Mono','SFMono-Regular',Consolas,monospace; fill: #f97316; letter-spacing: 3px; }
      .tag { font: 600 13px 'Segoe UI','Noto Sans KR',sans-serif; fill: #e2e8f0; }
      .lbl { font: 500 11px 'JetBrains Mono','SFMono-Regular',Consolas,monospace; fill: #94a3b8; }
      .band { fill: #64748b; fill-opacity: 0.22; stroke: #64748b; stroke-opacity: 0.5; stroke-width: 1; }
      .meas { fill: none; stroke: #f97316; stroke-width: 2; stroke-linejoin: round; }
      .flag { fill: none; stroke: #f87171; stroke-width: 1.5; animation: pulse 2.4s ease-in-out infinite; }
      .scan { stroke: #38bdf8; stroke-width: 1.5; opacity: 0.6; animation: sweep 6s linear infinite; }
      @keyframes pulse { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
      @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(430px); } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

